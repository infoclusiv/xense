name: Xense CI
on:
  pull_request:
  push:
    branches: [main, "feature/ai-cli-analysis-phase1"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: node --check companion/host.mjs
